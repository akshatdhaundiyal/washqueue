[project]
name = "washqueue-backend"
version = "2.0.0"
description = "WashQueue Hostel Laundry Management System with Smart Plug Telemetry"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tinytuya>=1.13.0",
    "aiosqlite>=0.20.0",
    "tuya-connector-python>=0.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
